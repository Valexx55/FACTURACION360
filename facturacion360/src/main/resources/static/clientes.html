<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Clientes | Facturación 360</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./img/fav.ico" type="image/png">
    <!-- defer: descarga en paralelo con el parseo del HTML y se ejecuta cuando el
         DOM ya está listo, así que no hace falta DOMContentLoaded. -->
   
</head>
<body>

<nav class="navbar">
  <div class="container"> <a class="navbar-brand" href="index.html">
      <img src="./img/finanzas.png" alt="Logo de Facturación 360" class="logo me-2">
      Facturación 360
    </a>

    <ul class="navbar-nav">
      <li><a class="nav-link" href="perfil.html">Inicio</a></li>
      <li><a class="nav-link active" href="clientes.html">Clientes</a></li>
      <li><a class="nav-link" href="facturas.html">Facturas</a></li>
    </ul>

  </div>
</nav>

  <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Panel de Gestión de Clientes</h2>
            <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#clienteModal">Añadir Cliente</button>
        </div>

      
        <!-- Barra de criterios: buscador + filtros + ordenación. Todos escriben en el
             mismo objeto de estado de clientes.js, así que se combinan entre sí: la
             ordenación se aplica sobre lo que haya dejado el filtro, no sobre todo. -->
        <div class="barra-filtros mb-4">

            <div class="buscador-clientes">
                <i class="fa-solid fa-magnifying-glass buscador-icono" aria-hidden="true"></i>
                <input type="search" id="buscador-clientes" class="buscador-input"
                       placeholder="Buscar por nombre o CIF..."
                       aria-label="Buscar cliente por nombre o CIF">
            </div>

            <div class="input-group input-group-sm control-filtro">
                <span class="input-group-text" aria-hidden="true"><i class="fa-solid fa-map-location-dot"></i></span>
                <select id="filtro-provincia" class="form-select" aria-label="Filtrar por provincia">
                    <option value="">Todas las provincias</option>
                </select>
            </div>

            <div class="input-group input-group-sm control-filtro">
                <span class="input-group-text" aria-hidden="true"><i class="fa-solid fa-city"></i></span>
                <!-- Arranca deshabilitado: se puebla en cascada al elegir provincia -->
                <select id="filtro-poblacion" class="form-select" aria-label="Filtrar por población">
                    <option value="">Todas las poblaciones</option>
                </select>
            </div>

            <!-- Criterio y sentido van en el mismo input-group para que se lean como
                 UN control: "ordenar por X, en este sentido". -->
            <div class="input-group input-group-sm control-orden">
                <span class="input-group-text" aria-hidden="true"><i class="fa-solid fa-arrow-down-short-wide"></i></span>
                <select id="filtro-ordenar-por" class="form-select" aria-label="Ordenar por">
                    <option value="fecha_alta">Fecha de alta</option>
                    <option value="nombre">Nombre</option>
                </select>
                <!-- El botón MUESTRA el orden actual; al pulsarlo, lo invierte. -->
                <button id="btn-direccion" type="button" class="btn btn-outline-secondary btn-direccion">
                    <i id="icono-direccion" class="fa-solid fa-arrow-down-wide-short" aria-hidden="true"></i>
                    <span id="etiqueta-direccion">Más recientes</span>
                </button>
            </div>

            <button id="btn-limpiar" type="button" class="btn btn-sm btn-link btn-limpiar">
                <i class="fa-solid fa-eraser" aria-hidden="true"></i> Limpiar
            </button>
        </div>
        <!--
            CORRECCION: el div.table-responsive envuelve UNICAMENTE la tabla y
            se cierra justo despues de cerrarla (uso correcto de Bootstrap: solo
            la tabla necesita scroll horizontal en movil). Se ha eliminado el
            div de cierre huerfano que sobraba tras el template (habia un div de
            cierre de mas) y se ha arreglado la indentacion para que la anidacion
            quede clara.
        -->
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-primary-custom">
                    <tr>
                        <!-- Cabeceras pulsables: es el gesto que todo el mundo prueba
                             primero en una tabla. Van dentro de un <button> real para
                             que se puedan usar con el teclado. aria-sort lo anuncia a
                             los lectores de pantalla; clientes.js lo mantiene al día. -->
                        <th scope="col" aria-sort="none">
                            <button type="button" class="th-ordenable" data-columna="nombre">
                                Nombre <i class="fa-solid fa-sort caret-orden" aria-hidden="true"></i>
                            </button>
                        </th>
                        <th scope="col">CIF</th>
                        <th scope="col">Email</th>
                        <th scope="col">Teléfono</th>
                        <th scope="col" aria-sort="descending">
                            <button type="button" class="th-ordenable" data-columna="fecha_alta">
                                Alta <i class="fa-solid fa-sort caret-orden" aria-hidden="true"></i>
                            </button>
                        </th>
                        <th scope="col" class="text-end">Acciones</th>
                    </tr>
                </thead>

                <!-- El cuerpo empieza vacío; clientes.js lo rellena clonando el template -->
                <tbody id="tabla-clientes"></tbody>
            </table>
        </div>

        <!-- Paginación: clientes.js activa/desactiva los botones según la página.
             aria-live="polite" hace que un lector de pantalla anuncie el cambio. -->
        <nav aria-label="Paginación de clientes"
             class="d-flex justify-content-between align-items-center mt-3">
            <!-- OJO: estos botones PAGINAN, no ordenan. Antes se llamaban "Más
                 recientes"/"Más antiguos", que ahora chocaría con el control de
                 ordenación por fecha: quien lo leyera no sabría si mueve de página
                 o cambia el orden. -->
            <button id="btn-anterior" type="button" class="btn btn-outline-secondary" disabled>
                <i class="fa-solid fa-chevron-left"></i> Anterior
            </button>
            <span id="info-pagina" class="text-muted" aria-live="polite"></span>
            <button id="btn-siguiente" type="button" class="btn btn-outline-secondary">
                Siguiente <i class="fa-solid fa-chevron-right"></i>
            </button>
        </nav>

        <!-- Plantilla oculta: su contenido NO se renderiza hasta que JS lo clona.
             Puede vivir en cualquier punto del documento; lo dejamos junto a la
             tabla que rellena para que se lea a la vez. -->
        <template id="fila-cliente-template">
            <tr>
                <td class="cliente-nombre"></td>
                <td class="cliente-cif"></td>
                <td class="cliente-email"></td>
                <td class="cliente-telefono"></td>
                <td class="cliente-alta"></td>
                <td class="text-end">
                    <button class="btn btn-sm btn-primary-custom-table btn-ver" title="Ver" aria-label="Ver cliente"><i class="fa-solid fa-eye"></i></button>
                    <button class="btn btn-sm btn-primary-custom-table btn-editar" title="Editar" aria-label="Editar cliente"><i class="fa-solid fa-pencil"></i></button>
                    <button class="btn btn-sm text-danger btn-eliminar" title="Eliminar" aria-label="Eliminar cliente"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>
        </template>
    </main>

    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p>&copy; 2026 Facturación 360. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Modal -->
    <div class="modal fade" id="clienteModal" tabindex="-1" aria-labelledby="clienteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="clienteModalLabel">Gestionar Cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formCliente">
                        <div class="mb-3">
                            <label for="nombreCliente" class="form-label">Nombre o Empresa</label>
                            <input type="text" class="form-control" id="nombreCliente" required>
                        </div>
                        <div class="mb-3">
                            <label for="cifCliente" class="form-label">CIF</label>
                            <input type="text" class="form-control" id="cifCliente" required>
                        </div>
                        <div class="mb-3">
                            <label for="emailCliente" class="form-label">Email</label>
                            <input type="email" class="form-control" id="emailCliente" required>
                        </div>
                        <div class="mb-3">
                            <label for="telefonoCliente" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefonoCliente" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary-custom" onclick="guardarCliente()">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

     <script src="clientes.js" defer></script>
</body>
</html>
